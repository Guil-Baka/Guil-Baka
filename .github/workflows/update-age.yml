name: Update age in README

on:
  schedule:
    - cron: "0 3 8 5 *" # 03:00 UTC = 00:00 Brazil (UTC-3) on May 8 (add egg + age update)
    - cron: "0 3 9 5 *" # 03:00 UTC = 00:00 Brazil (UTC-3) on May 9 (remove egg)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update age in README
        run: node .github/scripts/update-age.js

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update age in README" && git push)
